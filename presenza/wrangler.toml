name = "cat-presenza"
main = "src/index.js"
compatibility_date = "2026-08-04"

# Una sola istanza in memoria per tutto il gioco: è la «sala» in cui i
# dispositivi si fanno vivi.
[[durable_objects.bindings]]
name = "SALA"
class_name = "SalaPresenze"

# I Durable Object sul piano gratuito devono essere dichiarati come
# SQLite-backed. Qui lo stato resta comunque solo in memoria — la dichiarazione
# serve al piano, non al codice.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalaPresenze"]

[vars]
# ✏️ MODIFICA QUI se l'app cambia indirizzo: è l'unica origine autorizzata a
# mandare battiti. Lasciandolo scorretto, il browser dei partecipanti blocca le
# richieste e l'elenco resta vuoto senza dire perché.
ORIGINE_APP = "https://laminaccia.github.io"

# Il token dell'amministratore NON si scrive qui: questo file finisce su git.
#   npx wrangler secret put TOKEN_AMMINISTRATORE
